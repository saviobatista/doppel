[project]
name = "doppel-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "redis>=5.2",
    "boto3>=1.35",
    "anyio>=4.0",
    "fal-client>=0.5",
    "elevenlabs>=1.50",
    "anthropic>=0.69",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pillow>=12.2.0",
    "yt-dlp>=2026.6.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "fakeredis>=2.26",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "ASYNC", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doppel_api", "workers"]
