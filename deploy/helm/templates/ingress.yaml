apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kortes
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kortes.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.group }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certArn }}
    # idle_timeout alto: o app usa SSE de longa duracao (eventos de plan/video).
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    # Health check (path / em ambos os backends): o web fica atras de Basic Auth
    # (401) e a API nao tem rota / (404). Aceita ambos como "vivo".
    alb.ingress.kubernetes.io/success-codes: '200,401,404'
spec:
  ingressClassName: alb
  rules:
    {{- range .Values.ingress.webHosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kortes-web
                port:
                  number: {{ $.Values.web.port }}
    {{- end }}
    - host: {{ .Values.ingress.apiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kortes-api
                port:
                  number: {{ .Values.api.port }}
