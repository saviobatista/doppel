apiVersion: apps/v1
kind: Deployment
metadata:
  name: kortes-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kortes.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: kortes-api
  template:
    metadata:
      labels:
        app: kortes-api
        {{- include "kortes.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: api
          image: {{ .Values.image.registry }}/kortes-api:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # CMD = uvicorn -> o docker-entrypoint roda "alembic upgrade head" antes.
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: kortes-config
            - secretRef:
                name: kortes-secrets
          readinessProbe:
            tcpSocket:
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.api.port }}
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
