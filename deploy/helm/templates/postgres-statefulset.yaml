apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kortes-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kortes.labels" . | nindent 4 }}
spec:
  serviceName: kortes-postgres
  replicas: 1
  selector:
    matchLabels:
      app: kortes-postgres
  template:
    metadata:
      labels:
        app: kortes-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_USER
              value: doppel
            - name: POSTGRES_DB
              value: doppel
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kortes-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "doppel"]
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
